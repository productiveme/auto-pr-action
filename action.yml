name: 'Auto PR Creator'
description: 'Automatically creates a pull request when a new branch is pushed'
author: 'Your Name'

inputs:
  target_branch:
    description: 'The branch to create the PR against'
    required: false
    default: 'master'
  github_token:
    description: 'GitHub token for API access'
    required: true
  add_labels:
    description: 'Labels to add to the PR (comma-separated)'
    required: false
    default: 'WIP'
  target_branch_file:
    description: 'Path to a file containing the base branch name (first line, trimmed). Falls back to target_branch if the file is missing or empty.'
    required: false
    default: ''
  auto_stack:
    description: 'Stack the PR onto the branch it was cut from when that branch converges on the same base branch. Falls back to the resolved base branch otherwise.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Extract branch name
      shell: bash
      run: |
        branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        echo "branch=$branch" >> $GITHUB_OUTPUT

        # Create a formatted branch title by removing prefix and replacing dashes with spaces
        formatted_branch=$(echo $branch | sed 's|^[^/]*/||' | sed 's/-/ /g')

        # Check if the part after '/' starts with digits
        if [[ $branch =~ ^[^/]*/[0-9] ]]; then
          # Original behavior - extract issue number
          issue=$(echo $branch | awk -F'/' '{ print $2 }' | grep -o '[0-9]*' | head -n 1)
          echo "issue=$issue" >> $GITHUB_OUTPUT
          echo "branch_title=Update from $branch" >> $GITHUB_OUTPUT
        else
          # New behavior - use formatted branch name as title
          echo "issue=" >> $GITHUB_OUTPUT
          echo "branch_title=$formatted_branch" >> $GITHUB_OUTPUT
        fi
      id: extract_branch

    - name: Check for existing PR
      id: check_existing_pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        REPO_NAME="${{ github.repository }}"
        BRANCH_NAME="${{ steps.extract_branch.outputs.branch }}"
        REPO_OWNER="${{ github.repository_owner }}"

        # Debug output
        echo "Repository: $REPO_NAME"
        echo "Branch: $BRANCH_NAME"
        echo "Owner: $REPO_OWNER"

        # Query for existing PRs from this branch (regardless of target branch)
        # Note: This requires 'pull-requests: read' permission for the GITHUB_TOKEN
        api_response=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/${REPO_NAME}/pulls?head=${REPO_OWNER}:${BRANCH_NAME}&state=open")
        
        echo "API Response: $api_response"
        
        # Check if the response contains an error (error responses are objects with a "message" field)
        # Valid responses are arrays (even if empty)
        if echo "$api_response" | jq -e 'type == "object" and has("message")' > /dev/null 2>&1; then
          error_message=$(echo "$api_response" | jq -r '.message')
          echo "::warning::GitHub API error: $error_message"
          echo "::warning::This might be due to insufficient token permissions. The action will proceed to create a PR."
          existing_pr="false"
        else
          # No error, check if PRs exist (response should be an array)
          existing_pr=$(echo "$api_response" | jq -r 'if type == "array" and length > 0 then "true" else "false" end')
        fi

        echo "exists=$existing_pr" >> $GITHUB_OUTPUT

        if [ "$existing_pr" == "true" ]; then
          echo "An open pull request already exists for branch $BRANCH_NAME. Skipping PR creation."
        fi

    - name: Lookup Issue
      id: lookup_issue
      if: ${{ steps.extract_branch.outputs.issue != '' && steps.check_existing_pr.outputs.exists == 'false' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        REPO_NAME="${{ github.repository }}"
        ISSUE_NUMBER=${{ steps.extract_branch.outputs.issue }}

        title=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${REPO_NAME}/issues/${ISSUE_NUMBER}" | jq --raw-output '.title')
        echo "title=$title" >> $GITHUB_OUTPUT
        fixes="Fixes #${{ steps.extract_branch.outputs.issue }}"
        echo "fixes=$fixes" >> $GITHUB_OUTPUT

    - name: Resolve base branch
      id: resolve_base_branch
      if: ${{ steps.check_existing_pr.outputs.exists == 'false' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        AUTO_STACK: ${{ inputs.auto_stack }}
        CURRENT_BRANCH: ${{ steps.extract_branch.outputs.branch }}
      run: |
        set -euo pipefail

        base="${{ inputs.target_branch }}"
        branch_file="${{ inputs.target_branch_file }}"

        if [ -n "$branch_file" ] && [ -f "$branch_file" ]; then
          file_branch=$(head -n 1 "$branch_file" | tr -d '[:space:]')
          if [ -n "$file_branch" ]; then
            echo "Read base branch from file $branch_file: $file_branch"
            base="$file_branch"
          else
            echo "::notice::File $branch_file is empty; falling back to target_branch input ($base)."
          fi
        elif [ -n "$branch_file" ]; then
          echo "::notice::File $branch_file not found; falling back to target_branch input ($base)."
        fi

        resolved="$base"

        # Stack the PR onto the branch this one was cut from, when that branch is
        # itself converging on the same base branch. This lets a branch that was
        # built on another ticket's branch target that branch instead of the base,
        # keeping the PR diff focused. Enabled by default; opt out with
        # auto_stack: false.
        if [ -n "${AUTO_STACK:-}" ] && [ "${AUTO_STACK,,}" = "true" ]; then
          if git rev-parse --git-dir > /dev/null 2>&1; then
            # Make the history we need available: a full (unshallowed) clone and
            # every remote branch, so ancestry against other branches resolves.
            if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
              git fetch --no-tags --quiet --unshallow origin '+refs/heads/*:refs/remotes/origin/*' \
                || echo "::warning::Could not unshallow the repository; automatic stacking may be skipped."
            fi
            git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' \
              || echo "::warning::Could not fetch remote branches; automatic stacking may be skipped."

            branch="${CURRENT_BRANCH:-}"
            if [ -z "$branch" ]; then
              branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || true)
            fi
            head_sha=$(git rev-parse HEAD 2>/dev/null || echo "")

            # The branch this one was originally cut from: the most recent remote
            # branch (other than the base) whose tip is an ancestor of HEAD and that
            # has not already been merged into the base.
            parent=""
            best=0
            while read -r ref; do
              [ -z "$ref" ] && continue
              b="${ref#origin/}"
              case "$b" in "$branch" | "$base" | master | HEAD) continue ;; esac
              if [ -n "$head_sha" ] && [ "$(git rev-parse "$ref" 2>/dev/null || echo x)" = "$head_sha" ]; then continue; fi
              if ! git merge-base --is-ancestor "$ref" HEAD 2>/dev/null; then continue; fi
              if git merge-base --is-ancestor "$ref" "origin/$base" 2>/dev/null; then continue; fi
              t=$(git log -1 --format=%ct "$ref" 2>/dev/null || echo 0)
              if [ "$t" -gt "$best" ]; then best="$t"; parent="$b"; fi
            done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/)

            # Walk a branch's own PR base (or its base_branch file) up to a root,
            # to test whether it ultimately targets the same base branch.
            root_of() {
              local b="$1" next depth=0
              while [ "$depth" -lt 10 ]; do
                next=$(gh pr view "$b" --json baseRefName -q .baseRefName 2>/dev/null || true)
                if [ -z "$next" ]; then
                  next=$(git show "origin/$b:.github/base_branch" 2>/dev/null | tr -d '[:space:]' || true)
                fi
                if [ -z "$next" ] || [ "$next" = "$b" ]; then break; fi
                b="$next"
                depth=$((depth + 1))
              done
              printf '%s' "$b"
            }

            if [ -n "$parent" ] && [ "$(root_of "$parent")" = "$base" ]; then
              resolved="$parent"
            fi

            echo "Base branch: $base; parent candidate: ${parent:-none}; resolved: $resolved"
            {
              echo "### Auto PR base resolution"
              echo ""
              echo "- Base branch: \`$base\`"
              echo "- Parent candidate: \`${parent:-none}\`"
              echo "- Resolved base: \`$resolved\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Not a git checkout; skipping automatic PR stacking."
          fi
        fi

        echo "branch=$resolved" >> $GITHUB_OUTPUT

    - name: pull-request-action
      uses: vsoch/pull-request-action@master
      id: pull_request
      if: ${{ steps.check_existing_pr.outputs.exists == 'false' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PULL_REQUEST_BRANCH: ${{ steps.resolve_base_branch.outputs.branch }}
        PULL_REQUEST_TITLE: ${{ steps.lookup_issue.outputs.title || steps.extract_branch.outputs.branch_title }}
        PULL_REQUEST_BODY: |
          This is an automated pull request to update from branch ${{ steps.extract_branch.outputs.branch }}

          ${{ steps.lookup_issue.outputs.fixes || '' }}

    - name: Add labels
      id: add_labels
      if: ${{ steps.pull_request.outputs.pull_request_number != '' && steps.check_existing_pr.outputs.exists == 'false' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        REPO_NAME="${{ github.repository }}"
        PR_NUMBER="${{ steps.pull_request.outputs.pull_request_number }}"
        LABELS="${{ inputs.add_labels }}"
        
        if [ -n "$LABELS" ] && [ -n "$PR_NUMBER" ]; then
          echo "Adding labels '$LABELS' to PR #$PR_NUMBER"
          
          # Convert comma-separated labels to JSON array
          labels_json=$(echo "$LABELS" | sed 's/,/","/g' | sed 's/^/["/' | sed 's/$/"]/')
          
          # Try to add labels
          response=$(curl -sSL -w "%{http_code}" -o /tmp/label_response.json \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO_NAME}/issues/${PR_NUMBER}/labels" \
            -d "{\"labels\": $labels_json}")
          
          if [ "$response" = "200" ]; then
            echo "Successfully added labels to PR #$PR_NUMBER"
          else
            echo "::warning::Failed to add labels to PR #$PR_NUMBER (HTTP $response)"
            if [ -f /tmp/label_response.json ]; then
              error_msg=$(cat /tmp/label_response.json | jq -r '.message // "Unknown error"')
              echo "::warning::Error: $error_msg"
              echo "::notice::PR was created successfully, but labels could not be added due to insufficient permissions. Consider adding 'issues: write' permission to your workflow."
            fi
          fi
        else
          echo "Skipping label addition - no labels specified or PR number missing"
        fi

branding:
  icon: 'git-pull-request'
  color: 'blue'
